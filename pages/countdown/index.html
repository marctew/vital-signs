<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Countdown</title>
  <link rel="stylesheet" href="../_shared/module.css">
  <style>
    /* One event fills the box; several become rows with the number on the left. */
    .solo { height: 100%; display: flex; flex-direction: column; }
    .solo .number-slot { flex: 3; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .solo .label-slot { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .solo .number { font-weight: 700; font-variant-numeric: tabular-nums; }
    .solo .label { color: var(--accent); font-weight: 600; }
    .rows { height: 100%; display: grid; gap: calc(var(--s) * 1.2); }
    .rowitem { min-height: 0; display: flex; align-items: center; gap: calc(var(--t) * 0.3); padding: 0 calc(var(--t) * 0.3);
               background: var(--panel); border-radius: calc(var(--t) * 0.16); overflow: hidden; }
    .rowitem .number { flex: none; min-width: calc(var(--t) * 1.3); text-align: right; font-size: calc(var(--t) * 0.62); font-weight: 700;
                       font-variant-numeric: tabular-nums; color: var(--accent); }
    .rowitem .what { min-width: 0; }
    .rowitem .name { font-size: calc(var(--t) * 0.32); font-weight: 650; }
    .rowitem .unit { font-size: calc(var(--t) * 0.22); color: var(--muted); }
  </style>
</head>
<body>
  <div class="m">
    <p class="m-title" id="title"></p>
    <div class="m-body" id="body"></div>
  </div>
  <script src="../_shared/vitalsigns.js"></script>
  <script>
    var body = document.getElementById('body');
    var options, events = [];

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function parse(line) {
      var parts = line.split('|');
      var when = /(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(parts[parts.length - 1]);
      if (parts.length < 2 || !when) return null;
      var timed = when[4] !== undefined;
      return { name: parts.slice(0, -1).join('|').trim(), timed: timed,
               date: new Date(Number(when[1]), Number(when[2]) - 1, Number(when[3]), timed ? Number(when[4]) : 0, timed ? Number(when[5]) : 0) };
    }
    // How far away an event is, as a number and the words that go with it.
    function away(event, now) {
      var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var days = Math.round((new Date(event.date.getFullYear(), event.date.getMonth(), event.date.getDate()) - midnight) / 86400000);
      if (days > 1) return { number: String(days), unit: 'days until' };
      if (days === 1 && !event.timed) return { number: '1', unit: 'day until' };
      if (!event.timed) return { number: 'Today', unit: '' };
      var minutes = Math.max(0, Math.round((event.date - now) / 60000));
      if (minutes >= 120) return { number: String(Math.round(minutes / 60)), unit: 'hours until' };
      return { number: String(minutes), unit: minutes === 1 ? 'minute until' : 'minutes until' };
    }
    function render() {
      var now = new Date();
      var upcoming = events.filter(function (e) {
        return e.timed ? e.date > now : e.date >= new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }).sort(function (a, b) { return a.date - b.date; }).slice(0, Math.max(1, Number(options.max) || 4));
      VS.setActive(upcoming.length > 0);
      if (!upcoming.length) return VS.message(body, 'Nothing to count down to.');
      body.textContent = '';
      if (upcoming.length === 1) {
        var only = away(upcoming[0], now);
        var solo = el('div', 'solo'), numberSlot = el('div', 'number-slot'), labelSlot = el('div', 'label-slot');
        var number = el('span', 'number', only.number), label = el('span', 'label', (only.unit + ' ' + upcoming[0].name).trim());
        numberSlot.appendChild(number); labelSlot.appendChild(label);
        solo.appendChild(numberSlot); solo.appendChild(labelSlot);
        body.appendChild(solo);
        VS.fit(number, numberSlot); VS.fit(label, labelSlot);
        return;
      }
      var rows = el('div', 'rows');
      var grid = VS.bestGrid(body, upcoming.length, 4.2);
      rows.style.gridTemplateColumns = 'repeat(' + grid.cols + ', 1fr)';
      rows.style.setProperty('--t', grid.scale + 'px');
      upcoming.forEach(function (event) {
        var a = away(event, now), row = el('div', 'rowitem'), what = el('div', 'what');
        row.appendChild(el('div', 'number', a.number));
        what.appendChild(el('div', 'name m-nowrap', event.name));
        if (a.unit) what.appendChild(el('div', 'unit m-nowrap', a.unit.replace(' until', '')));
        row.appendChild(what);
        rows.appendChild(row);
      });
      body.appendChild(rows);
    }

    VS.module().then(function (o) {
      options = o;
      document.getElementById('title').textContent = o.title || '';
      events = (o.events || []).map(parse).filter(Boolean);
      VS.onResize(render);
      setInterval(render, 30000);
    }).catch(function (e) { VS.message(body, e.message); });
  </script>
</body>
</html>
