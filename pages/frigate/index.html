<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frigate cameras</title>
  <link rel="stylesheet" href="../_shared/module.css">
  <style>
    .m { padding: calc(var(--s) * 0.8); gap: calc(var(--s) * 0.8); }
    .m-title { padding: calc(var(--s) * 0.6) calc(var(--s) * 0.8) 0; }
    .cams { height: 100%; display: grid; gap: calc(var(--s) * 0.8); }
    .cam { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; border-radius: calc(var(--s) * 0.8); }
    .cam video, .cam img, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .contain .cam video, .contain .cam img, .contain .cam canvas { object-fit: contain; }
    /* One at a time: tiles are stacked and the next one fades in once it has a picture. */
    .cams.cycle { display: block; position: relative; }
    .cycle .cam { position: absolute; inset: 0; transition: opacity 0.6s; }
    .cycle .cam.waiting { opacity: 0; }
    .label { position: absolute; left: calc(var(--s) * 1); bottom: calc(var(--s) * 1); padding: calc(var(--s) * 0.4) calc(var(--s) * 1);
             border-radius: calc(var(--s) * 0.6); background: rgba(0, 0, 0, 0.6); font-size: calc(var(--s) * 2.2); font-weight: 600; }
  </style>
</head>
<body>
  <!-- Frigate cameras. ?demo=N shows N placeholder cameras without a Frigate server, for trying layouts;
       add &layout=cycle&dwell=3 to try one at a time. -->
  <div class="m">
    <p class="m-title" id="title"></p>
    <div class="m-body" id="body"></div>
  </div>
  <script src="../_shared/vitalsigns.js"></script>
  <script>
    var body = document.getElementById('body');
    var options, cameras = null, mounted = [], generation = 0, cycleTimer;
    var LIVE_FAILURES = 3;      // after this many failed attempts a camera shows pictures instead
    var STALL_SECONDS = 12;

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }
    function base() { return String(options.frigate || '').replace(/\/+$/, ''); }

    // --- pictures: each new still is fetched, drawn onto a canvas and released ---------------
    // Swapping an <img> to a new address every second or two leaves Chromium holding the old
    // decoded pictures; over days that reached gigabytes. Drawing onto one canvas and closing
    // each bitmap keeps the tile at a constant size. If Frigate will not let the page read the
    // picture (no CORS), it falls back to an <img> that is reused, with the loader's copy released.
    function Snapshots(tile, camera, onReady) {
      var canvas = el('canvas'), img = null, context = canvas.getContext('2d');
      tile.insertBefore(canvas, tile.firstChild);
      var stopped = false, timer, useImage = !!camera.demo;
      function ready() { if (onReady) { onReady(); onReady = null; } }
      function again() { timer = setTimeout(next, Math.max(1, Number(options.interval) || 2) * 1000); }
      function url() {
        var height = Math.min(1080, Math.max(180, Math.round(tile.clientHeight * (window.devicePixelRatio || 1) / 60) * 60));
        return camera.demo || (base() + '/api/' + encodeURIComponent(camera.name) + '/latest.jpg?h=' + height);
      }
      function viaImage() {
        if (!img) {
          img = el('img');
          img.alt = camera.name;
          canvas.replaceWith(img);
        }
        var loader = new Image();
        loader.onload = function () {
          if (!stopped) { img.src = loader.src; ready(); }
          loader.src = '';
          again();
        };
        loader.onerror = again;
        loader.src = url() + (camera.demo ? '' : '&_=' + Date.now());
      }
      function next() {
        if (stopped) return;
        if (useImage) return viaImage();
        fetch(url(), { cache: 'no-store', mode: 'cors' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.blob();
        }).then(function (blob) {
          return createImageBitmap(blob);
        }).then(function (bitmap) {
          if (!stopped) {
            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
              canvas.width = bitmap.width; canvas.height = bitmap.height;
            }
            context.drawImage(bitmap, 0, 0);
            ready();
          }
          bitmap.close();
          again();
        }).catch(function (e) {
          if (e instanceof TypeError) { useImage = true; return viaImage(); }    // CORS refused: use <img>
          again();
        });
      }
      next();
      this.stop = function () { stopped = true; clearTimeout(timer); canvas.remove(); if (img) img.remove(); };
    }

    // --- live video: fragmented MP4 over a websocket from Frigate's go2rtc, played with MSE ----
    var CODECS = ['avc1.640029', 'avc1.64002A', 'avc1.640033', 'hvc1.1.6.L153.B0', 'mp4a.40.2', 'mp4a.40.5', 'flac', 'opus'];
    function Live(tile, camera, onGiveUp, onReady) {
      var video = el('video');
      video.muted = true; video.autoplay = true; video.playsInline = true;
      video.addEventListener('playing', function () { if (onReady) { onReady(); onReady = null; } });
      tile.insertBefore(video, tile.firstChild);
      var stopped = false, failures = 0, ws, retry, watchdog, lastData = 0;

      function fail() {
        if (stopped) return;
        cleanup();
        failures++;
        if (failures >= LIVE_FAILURES) { stopped = true; video.remove(); return onGiveUp(); }
        retry = setTimeout(connect, 4000);
      }
      function cleanup() {
        clearInterval(watchdog);
        if (ws) { ws.onclose = ws.onerror = ws.onmessage = null; try { ws.close(); } catch (e) {} ws = null; }
      }
      function connect() {
        if (stopped) return;
        var source = new MediaSource(), buffer = null, queue = [], opened = 0;
        video.src = URL.createObjectURL(source);
        ws = new WebSocket(base().replace(/^http/, 'ws') + '/live/mse/api/ws?src=' + encodeURIComponent(camera.stream));
        ws.binaryType = 'arraybuffer';
        lastData = Date.now();

        function hello() {      // needs both the websocket and the media source to be open
          if (++opened < 2) return;
          var supported = CODECS.filter(function (c) { return MediaSource.isTypeSupported('video/mp4; codecs="' + c + '"'); });
          ws.send(JSON.stringify({ type: 'mse', value: supported.join(',') }));
        }
        function flush() {
          if (!buffer || buffer.updating) return;
          try {
            if (queue.length) { buffer.appendBuffer(queue.shift()); return; }
            // Stay near the live edge and keep the buffer short.
            if (video.buffered.length) {
              var start = video.buffered.start(0), end = video.buffered.end(video.buffered.length - 1);
              if (end - video.currentTime > 4) video.currentTime = end - 0.5;
              if (end - start > 20) buffer.remove(start, end - 10);
            }
          } catch (e) { fail(); }
        }
        source.addEventListener('sourceopen', hello, { once: true });
        ws.onopen = hello;
        ws.onerror = ws.onclose = fail;
        ws.onmessage = function (event) {
          lastData = Date.now();
          if (typeof event.data === 'string') {
            var message = JSON.parse(event.data);
            if (message.type === 'error') return fail();
            if (message.type === 'mse') {
              try {
                buffer = source.addSourceBuffer(message.value);
                buffer.mode = 'segments';
                buffer.addEventListener('updateend', flush);
              } catch (e) { fail(); }
            }
            return;
          }
          queue.push(event.data);
          if (queue.length > 200) return fail();
          flush();
          failures = 0;
          if (video.paused) video.play().catch(function () {});
        };
        watchdog = setInterval(function () {
          if (Date.now() - lastData > STALL_SECONDS * 1000) fail();
        }, 3000);
      }
      connect();
      this.stop = function () { stopped = true; clearTimeout(retry); cleanup(); video.remove(); };
    }

    // --- layout: the grid whose tiles come out largest for the cameras' shape ------------------
    function grid(count, width, height, aspect) {
      var best = { cols: 1, size: 0 };
      for (var cols = 1; cols <= count; cols++) {
        var rows = Math.ceil(count / cols);
        var w = width / cols, h = height / rows;
        var size = options.fit === 'contain' ? Math.min(w, h * aspect) : Math.min(w / aspect, h) * Math.min(w, h * aspect);
        if (size > best.size) best = { cols: cols, size: size };
      }
      return best.cols;
    }
    // Put one camera in `parent`. onReady is called once it has a picture to show.
    function mount(camera, parent, onReady) {
      var tile = el('div', 'cam');
      if (options.names) tile.appendChild(el('div', 'label', camera.label || camera.name.replace(/_/g, ' ')));
      parent.appendChild(tile);
      var player;
      var pictures = function () { player = new Snapshots(tile, camera, onReady); };
      if (options.mode === 'live' && camera.stream && window.MediaSource && !camera.demo) {
        player = new Live(tile, camera, pictures, onReady);
      } else {
        pictures();
      }
      return { tile: tile, stop: function () { player.stop(); tile.remove(); } };
    }

    function render() {
      if (!cameras) return;
      generation++;
      clearTimeout(cycleTimer);
      mounted.forEach(function (m) { m.stop(); });
      mounted = [];
      if (!cameras.length) return VS.message(body, 'No cameras to show.');
      body.textContent = '';
      var cycling = options.layout === 'cycle' && cameras.length > 1;
      var wrap = el('div', 'cams' + (options.fit === 'contain' ? ' contain' : '') + (cycling ? ' cycle' : ''));
      body.appendChild(wrap);
      if (cycling) return cycle(wrap, 0, generation);
      var aspect = cameras[0].width && cameras[0].height ? cameras[0].width / cameras[0].height : 16 / 9;
      var columns = Number(options.columns) || grid(cameras.length, body.clientWidth, body.clientHeight, aspect);
      wrap.style.gridTemplateColumns = 'repeat(' + Math.min(columns, cameras.length) + ', 1fr)';
      cameras.forEach(function (camera) { mounted.push(mount(camera, wrap)); });
    }

    // One camera at a time. Only the camera on screen (and the one arriving) is connected.
    function cycle(wrap, index, mine) {
      if (mine !== generation) return;
      var revealed = false;
      var next = mount(cameras[index % cameras.length], wrap, reveal);
      next.tile.classList.add('waiting');
      mounted.push(next);
      function reveal() {
        if (revealed || mine !== generation) return;
        revealed = true;
        next.tile.classList.remove('waiting');
        setTimeout(function () {        // drop the previous camera once the fade has finished
          if (mine !== generation) return;
          mounted.filter(function (m) { return m !== next; }).forEach(function (m) { m.stop(); });
          mounted = [next];
        }, 700);
      }
      setTimeout(reveal, 5000);         // show it even if its picture is slow to arrive
      cycleTimer = setTimeout(function () { cycle(wrap, index + 1, mine); },
                              Math.max(3, Number(options.dwell) || 10) * 1000);
    }

    function demo(count) {
      var colours = ['#1c7ed6', '#c2255c', '#2f9e44', '#e8590c', '#7048e8', '#1098ad', '#d6336c', '#5c940d'];
      var list = [];
      for (var i = 0; i < Math.max(1, Math.min(8, count)); i++) {
        list.push({ name: 'camera_' + (i + 1), width: 1280, height: 720, demo: 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="' + colours[i] +
          '"/><circle cx="640" cy="360" r="200" fill="rgba(255,255,255,0.25)"/></svg>') });
      }
      return list;
    }
    function load() {
      if (VS.params.demo) { cameras = demo(Number(VS.params.demo)); return render(); }
      VS.moduleData().then(function (data) {
        var changed = JSON.stringify(data.cameras) !== JSON.stringify(cameras);
        cameras = data.cameras;
        if (changed) render();
      }).catch(function (e) { if (!cameras) VS.message(body, e.message); VS.retrySoon(load); });
    }

    VS.module().then(function (o) {
      options = o;
      if (VS.params.demo) {     // let the preview try the other settings from the address
        ['layout', 'dwell', 'fit', 'columns'].forEach(function (k) { if (VS.params[k]) options[k] = VS.params[k]; });
      }
      document.getElementById('title').textContent = o.title || '';
      VS.every(300, load);    // picks up cameras added to or removed from Frigate
      var first = true;
      VS.onResize(function () { if (first) { first = false; return; } render(); });
    }).catch(function (e) { VS.message(body, e.message); });
  </script>
</body>
</html>
