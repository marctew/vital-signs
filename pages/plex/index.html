<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plex now playing</title>
  <link rel="stylesheet" href="../_shared/module.css">
  <style>
    /* The layout follows the room each stream gets (set as a class by the script):
         compact  small box: the artwork as large as it will go, progress bar underneath
         row      wide box: artwork on the left, details beside it
         stack    tall box: artwork on top, details below                                   */
    .sessions { height: 100%; display: flex; flex-direction: column; gap: calc(var(--s) * 1.5); }
    .sessions.across { flex-direction: row; }
    .session { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; gap: calc(var(--s) * 2.2); overflow: hidden; }
    .art { display: block; min-width: 0; min-height: 0; object-fit: contain; border-radius: calc(var(--s) * 1); }
    .info { min-width: 0; }
    .name { font-size: calc(var(--s) * 4.6); font-weight: 700; line-height: 1.12; }
    .sub { font-size: calc(var(--s) * 3.2); color: var(--muted); margin-top: calc(var(--s) * 0.8); }
    .who { font-size: calc(var(--s) * 2.8); color: var(--accent); margin-top: calc(var(--s) * 1); }
    .synopsis { font-size: calc(var(--s) * 2.7); line-height: 1.35; margin-top: calc(var(--s) * 1.4);
                display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .stack .synopsis { text-align: left; }
    .bar { height: calc(var(--s) * 1); margin-top: calc(var(--s) * 1.6); border-radius: 99px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .paused .bar span { background: var(--muted); }
    .paused .art { opacity: 0.55; }

    .row .art { flex: none; height: 100%; max-width: 46%; }
    .row .info { flex: 1; }

    .stack { flex-direction: column; align-items: stretch; text-align: center; }
    .stack .art { flex: 1; width: 100%; }
    .stack .info { flex: none; }

    .compact { flex-direction: column; align-items: center; gap: calc(var(--s) * 1.4); }
    .compact .art { flex: 1; max-width: 100%; }
    .compact .info { flex: none; width: 100%; }
    .compact .bar { margin: 0 auto; height: calc(var(--s) * 1.6); }
    .compact.has-art .name, .compact.has-art .sub, .compact.has-art .who { display: none; }
    .compact .name { font-size: calc(var(--s) * 5); text-align: center; }

    /* Nothing playing: a wall of recently added posters, as large as fits. */
    .recent { height: 100%; display: grid; justify-content: center; align-content: center; gap: calc(var(--s) * 1.4); }
    .recent img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: calc(var(--s) * 0.9);
                  background: rgba(255, 255, 255, 0.08); }

    .m.tight { padding: calc(var(--s) * 1.4); }
    .m.tight .m-title { display: none; }
  </style>
</head>
<body>
  <!-- Plex now playing. For trying layouts without a Plex server: ?demo=N shows N sample streams,
       ?demo=recent shows the recently added wall. -->
  <div class="m" id="module">
    <p class="m-title" id="title"></p>
    <div class="m-body" id="body"></div>
  </div>
  <script src="../_shared/vitalsigns.js"></script>
  <script>
    var body = document.getElementById('body');
    var options, sessions = null, recent = [];
    var COMPACT_BELOW = 500000;     // px² per stream: about one cell of a 1080 x 2560 screen's grid

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }
    // In compact mode the bar sits under the artwork and stays exactly as wide as it.
    // The artwork's box takes the picture's proportions, so its width is the picture's width.
    var artSizes = new ResizeObserver(function (entries) {
      entries.forEach(function (entry) {
        var card = entry.target.closest('.session');
        var bar = card && card.querySelector('.bar');
        if (bar) bar.style.width = card.classList.contains('compact') ? entry.target.clientWidth + 'px' : '';
      });
    });

    function render() {
      if (sessions === null) return;
      var shown = options.paused ? sessions : sessions.filter(function (s) { return s.state !== 'paused'; });
      shown = shown.slice(0, 4);
      var module = document.getElementById('module');
      document.getElementById('title').textContent = options.title || '';
      if (!shown.length) {
        module.classList.remove('tight');
        if (options.idle_mode === 'recent' && recent.length) return renderRecent();
        return VS.message(body, options.idle || '');
      }
      // Work out the room each stream gets, then pick its layout.
      var across = document.documentElement.dataset.shape === 'wide';
      var width = window.innerWidth / (across ? shown.length : 1);
      var height = window.innerHeight / (across ? 1 : shown.length);
      var compact = width * height < COMPACT_BELOW;
      var layout = compact ? 'compact' : (height > width * 1.15 ? 'stack' : 'row');
      module.classList.toggle('tight', compact);

      artSizes.disconnect();
      body.textContent = '';
      var fitted = [];
      var wrap = el('div', 'sessions' + (across ? ' across' : ''));
      shown.forEach(function (s) {
        var card = el('div', 'session ' + layout + (s.state === 'paused' ? ' paused' : ''));
        if (s.image) {
          var art = el('img', 'art');
          art.alt = '';
          art.addEventListener('load', function () { card.classList.add('has-art'); artSizes.observe(art); });
          art.addEventListener('error', function () { art.remove(); });
          art.src = s.image;
          card.appendChild(art);
        }
        var info = el('div', 'info');
        info.appendChild(el('div', 'name m-clamp2', s.title));
        if (s.subtitle) info.appendChild(el('div', 'sub m-clamp2', s.subtitle));
        var who = [options.show_user ? s.user : '', s.state === 'paused' ? 'Paused' : ''].filter(Boolean).join(' · ');
        if (who) info.appendChild(el('div', 'who m-nowrap', who));
        var synopsis = null;
        if (options.synopsis && s.summary && layout !== 'compact') {
          synopsis = el('div', 'synopsis', s.summary);
          synopsis.hidden = true;       // shown below, once we know how many lines fit
          info.appendChild(synopsis);
        }
        var bar = el('div', 'bar');
        var fill = el('span');
        fill.style.width = Math.round((s.progress || 0) * 100) + '%';
        bar.appendChild(fill);
        info.appendChild(bar);
        card.appendChild(info);
        wrap.appendChild(card);
        if (synopsis) fitted.push({ card: card, info: info, synopsis: synopsis, layout: layout });
      });
      body.appendChild(wrap);
      fitted.forEach(fitSynopsis);
    }

    // Show as many lines of the synopsis as the space left over allows, or none.
    function fitSynopsis(f) {
      f.synopsis.hidden = false;
      var line = parseFloat(getComputedStyle(f.synopsis).lineHeight);
      f.synopsis.hidden = true;
      var free;
      if (f.layout === 'row') {
        free = f.card.clientHeight - f.info.offsetHeight;            // beside the artwork
      } else {
        free = f.card.clientHeight * 0.22;                            // below it: never squeeze the artwork much
        if (f.card.clientHeight < 900) free = 0;
      }
      var lines = Math.floor((free - line * 0.8) / line);
      if (lines < 2) return;
      f.synopsis.style.webkitLineClamp = String(Math.min(lines, 9));
      f.synopsis.hidden = false;
    }

    // Choose the poster grid that covers the most of the box, then fill it with the newest items.
    function renderRecent() {
      document.getElementById('title').textContent = options.recent_title || '';
      artSizes.disconnect();
      body.textContent = '';
      var gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) * 1.4;
      var width = body.clientWidth, height = body.clientHeight;
      var best = { area: 0, cols: 1, count: 1, w: 0 };
      for (var cols = 1; cols <= 12; cols++) {
        var w = (width - gap * (cols - 1)) / cols;
        var rows = Math.floor((height + gap) / (w * 1.5 + gap));
        if (rows < 1) {         // too tall at this width: fit one row to the height instead
          rows = 1;
          w = Math.min(w, height / 1.5);
        }
        var count = Math.min(cols * rows, recent.length);
        var area = count * w * w * 1.5;
        if (area > best.area) best = { area: area, cols: Math.min(cols, count), count: count, w: w };
      }
      var grid = el('div', 'recent');
      grid.style.gridTemplateColumns = 'repeat(' + best.cols + ', ' + Math.floor(best.w) + 'px)';
      var request = Math.min(1600, Math.ceil(best.w * (window.devicePixelRatio || 1) / 100) * 100);
      recent.slice(0, best.count).forEach(function (item) {
        var poster = el('img');
        poster.alt = item.title;
        poster.addEventListener('error', function () { poster.remove(); });
        poster.src = item.image + (item.image.indexOf('/api/module/') === 0 ? '&w=' + request : '');
        grid.appendChild(poster);
      });
      body.appendChild(grid);
    }

    function demo(count) {
      var poster = function (colour) {
        return 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="' + colour +
          '"/><text x="200" y="320" font-size="60" fill="white" text-anchor="middle" font-family="sans-serif">Poster</text></svg>');
      };
      var all = [
        { user: 'Marc', title: 'The Example Show', subtitle: 'S2 E5 · A Long Episode Title', state: 'playing', progress: 0.42, image: poster('#3b5bdb'),
          summary: "A sprawling example synopsis that says what happens in this episode at some length, so that it wraps over several lines and shows how much of it the module keeps when the box it has been given is wide, tall or small. It carries on a little further to be sure there is more text than will ever fit." },
        { user: 'Sam', title: 'A Film', subtitle: '1999', state: 'paused', progress: 0.8, image: poster('#c2255c'), summary: 'A short synopsis for the film.' },
        { user: 'Alex', title: 'Another Series', subtitle: 'S1 E1 · Pilot', state: 'playing', progress: 0.1, image: poster('#2f9e44') }
      ];
      if (VS.params.demo === 'recent') {
        options.idle_mode = 'recent';
        var colours = ['#3b5bdb', '#c2255c', '#2f9e44', '#e8590c', '#7048e8', '#1098ad', '#d6336c', '#5c940d'];
        recent = [];
        for (var i = 0; i < 20; i++) recent.push({ title: 'Item ' + (i + 1), image: poster(colours[i % colours.length]) });
        return [];
      }
      return all.slice(0, Math.max(1, Math.min(3, count)));
    }
    function load() {
      if (VS.params.demo) { sessions = demo(Number(VS.params.demo)); return render(); }
      VS.moduleData().then(function (data) { sessions = data.sessions; recent = data.recent || []; render(); })
        .catch(function (e) { if (sessions === null) VS.message(body, e.message); });
    }

    VS.module().then(function (o) {
      options = o;
      VS.every(10, load);
      VS.onResize(render);
    }).catch(function (e) { VS.message(body, e.message); });
  </script>
</body>
</html>
