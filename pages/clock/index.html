<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clock</title>
  <link rel="stylesheet" href="../_shared/module.css">
  <style>
    .m-body { display: flex; flex-direction: column; }
    .slot { min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #time-slot { flex: 3; }
    #date-slot { flex: 1; }
    #time { font-weight: 700; font-variant-numeric: tabular-nums; }
    #date { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <!-- Clock module. Add it on the Content page to set its options; without that it also accepts
       ?title=, ?tz= and ?hour12=1 in the URL. -->
  <div class="m">
    <p class="m-title" id="title"></p>
    <div class="m-body">
      <div class="slot" id="time-slot"><span id="time"></span></div>
      <div class="slot" id="date-slot"><span id="date"></span></div>
    </div>
  </div>
  <script src="../_shared/vitalsigns.js"></script>
  <script>
    VS.module().then(function (o) {
      var zone = o.tz || VS.params.tz || undefined;
      var hour12 = o.hour12 || VS.params.hour12 === '1';
      var time = document.getElementById('time'), date = document.getElementById('date');
      document.getElementById('title').textContent = o.title || VS.params.title || '';
      document.getElementById('date-slot').hidden = !o.date;
      var widest = '';

      function tick() {
        var now = new Date();
        var format = { hour: '2-digit', minute: '2-digit', hour12: hour12, timeZone: zone };
        if (o.seconds) format.second = '2-digit';
        time.textContent = now.toLocaleTimeString('en-GB', format);
        var text = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: zone });
        if (date.textContent !== text) { date.textContent = text; layout(); }
        if (time.textContent.length !== widest.length) { widest = time.textContent; layout(); }
      }
      function layout() {
        VS.fit(time, document.getElementById('time-slot'));
        if (o.date) VS.fit(date, document.getElementById('date-slot'));
      }
      tick();
      VS.onResize(layout);
      setInterval(tick, o.seconds ? 250 : 1000);
    });
  </script>
</body>
</html>
