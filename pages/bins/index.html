<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bins</title>
  <link rel="stylesheet" href="../_shared/module.css">
  <style>
    .bins { height: 100%; display: flex; flex-direction: column; gap: calc(var(--s) * 2); }
    [data-shape="wide"] .bins { flex-direction: row; align-items: stretch; }
    .next { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--s) * 1); }
    .next .label { flex: none; font-size: calc(var(--s) * 3.4); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .next.soon .label { color: var(--accent); }
    .next .names { flex: 1; min-height: 0; overflow: hidden; }
    .next .bin { font-weight: 700; line-height: 1.15; }
    .later { flex: 1.15; min-width: 0; min-height: 0; }
    [data-shape="tall"] .later { flex: 1.5; }
    .later.spread { justify-content: space-evenly; }
    .day { flex: none; display: flex; gap: calc(var(--s) * 2); align-items: baseline; }
    .day .name { flex: none; width: calc(var(--s) * 17); font-weight: 700; }
    .day .what { flex: 1; min-width: 0; }
    [data-medium="eink"] .next .label { color: #000; }
    [data-medium="eink"] .next.soon .label { color: var(--accent); }
    [data-medium="eink"] .day { padding-bottom: calc(var(--s) * 1); border-bottom: 2px solid #000; }
    [data-medium="eink"] .day:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <div class="m">
    <p class="m-title" id="title"></p>
    <div class="m-body" id="body"></div>
  </div>
  <script src="../_shared/vitalsigns.js"></script>
  <script>
    var body = document.getElementById('body');
    var options, last = null;

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }
    function render() {
      if (!last) return;
      var days = last.days || [];
      VS.setActive(days.length > 0 && (!options.only_soon || days[0].soon));
      VS.sourceTime('Bins', last.fetched);
      document.getElementById('title').textContent = options.title || '';
      body.textContent = '';
      if (!days.length) return VS.message(body, 'No collections found.');
      var wrap = el('div', 'bins');

      var first = days[0], next = el('div', 'next' + (first.soon ? ' soon' : '')), names = el('div', 'names'), text = el('div');
      next.appendChild(el('div', 'label', first.label));
      first.bins.forEach(function (name) { text.appendChild(el('div', 'bin', name)); });
      names.appendChild(text);
      next.appendChild(names);
      wrap.appendChild(next);

      var list = null;
      if (days.length > 1) {
        list = el('div', 'later m-list');
        days.slice(1).forEach(function (day) {
          var row = el('div', 'day');
          row.appendChild(el('div', 'name', day.label));
          row.appendChild(el('div', 'what m-clamp2', day.bins.join(', ')));
          list.appendChild(row);
        });
        wrap.appendChild(list);
      }
      body.appendChild(wrap);
      VS.fitBlock(text, names);
      var cap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) * 9;
      if (parseFloat(text.style.fontSize) > cap) text.style.fontSize = cap + 'px';
      if (list) {
        VS.clip(list);
        list.classList.add('spread');
      }
    }
    function load() {
      VS.moduleData().then(function (data) { last = data; render(); })
        .catch(function (e) { if (!last) { VS.message(body, e.message); VS.setActive(true); } VS.retrySoon(load); });
    }

    VS.module().then(function (o) {
      options = o;
      VS.every(900, load);
      VS.onResize(render);
    }).catch(function (e) { VS.message(body, e.message); });
  </script>
</body>
</html>
